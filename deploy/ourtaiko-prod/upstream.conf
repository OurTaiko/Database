# /opt/1panel/www/conf.d/ourtaiko-database-upstream.conf on ourtaiko-prod
# (http context). Keeps TLS connections to sakura open between requests; a
# new handshake costs about 0.3 s at sakura's 142 ms round trip.
upstream ourtaiko_database_sakura {
    server 101.34.19.31:18443;
    keepalive 8;
}
