# /www/server/panel/vhost/nginx/ourtaiko-database-upstream.conf on sakura.
# database.ourtaiko.org is served by ourtaiko-prod (sakura's domain traffic
# is blocked for lacking an ICP filing). ourtaiko-prod forwards /api/ here by
# IP, without the domain in SNI or Host, over TLS with a self-signed
# certificate it pins (/etc/ourtaiko-database/upstream-tls/, SAN IP
# 101.34.19.31). Only ourtaiko-prod may connect; the Tencent security group
# also admits TCP 18443 from it alone.
server {
    listen 18443 ssl http2;
    server_name _;
    ssl_certificate /etc/ourtaiko-database/upstream-tls/upstream.crt;
    ssl_certificate_key /etc/ourtaiko-database/upstream-tls/upstream.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 112m;
    client_body_timeout 180s;
    access_log /www/wwwlogs/ourtaiko-database-upstream.log;
    error_log /www/wwwlogs/ourtaiko-database-upstream.error.log;

    # The client address arrives from ourtaiko-prod in X-Real-IP. The realip
    # module replaces $remote_addr before allow/deny run, so the check uses
    # the address of the connection itself.
    set_real_ip_from 154.64.230.124;
    real_ip_header X-Real-IP;
    if ($realip_remote_addr != 154.64.230.124) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host database.ourtaiko.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
