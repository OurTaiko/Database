# /www/server/panel/vhost/nginx/database.ourtaiko.org.conf on sakura.
# Written by hand, not through the BT panel; the certificate comes from
# certbot (webroot /www/wwwroot/acme), renewed by certbot's timer.
server {
    listen 80;
    server_name database.ourtaiko.org;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name database.ourtaiko.org;
    ssl_certificate /etc/letsencrypt/live/database.ourtaiko.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/database.ourtaiko.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 112m;
    client_body_timeout 180s;
    access_log /www/wwwlogs/database.ourtaiko.org.log;
    error_log /www/wwwlogs/database.ourtaiko.org.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
