# /www/sites/database.ourtaiko.org/database.conf on ourtaiko-prod (included in
# the 1Panel server block of database.ourtaiko.org, like fanmade.conf).
# The website is static here; /api/ goes to the API on sakura, which cannot
# serve the domain itself (Tencent blocks it for lacking an ICP filing). The
# request to sakura carries no domain in SNI or Host, and sakura's
# self-signed certificate is pinned.
client_max_body_size 112m;
client_body_timeout 180s;
add_header X-Content-Type-Options nosniff always;

location ^~ /api/ {
    proxy_pass https://ourtaiko_database_sakura;
    proxy_http_version 1.1;
    proxy_ssl_server_name off;
    proxy_ssl_name 101.34.19.31;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /www/sites/database.ourtaiko.org/sakura-upstream.crt;
    proxy_ssl_session_reuse on;
    proxy_set_header Host 101.34.19.31;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 240s;
    proxy_request_buffering off;
    proxy_buffering off;
}
location = /readyz {
    proxy_pass https://ourtaiko_database_sakura;
    proxy_http_version 1.1;
    proxy_ssl_server_name off;
    proxy_ssl_name 101.34.19.31;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /www/sites/database.ourtaiko.org/sakura-upstream.crt;
    proxy_set_header Host 101.34.19.31;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
}
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}
location / {
    try_files $uri $uri/ /index.html;
}
